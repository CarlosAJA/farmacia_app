services:
  # Contenedor de la Base de Datos
  db:
    image: mysql:8.0
    container_name: farmacia_db_container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: farmaciapassword
      MYSQL_DATABASE: farmacia_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-db:/docker-entrypoint-initdb.d

  # Contenedor del Servidor Node.js
  backend:
    build: ./backend
    container_name: farmacia_backend_container
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DB_HOST=db # Docker mapea el nombre del servicio como dirección IP interna
      - DB_USER=root
      - DB_PASSWORD=farmaciapassword
      - DB_NAME=farmacia_db
      - JWT_SECRET=farmaciafull123456
    depends_on:
      - db

  # Contenedor de la Interfaz React
  frontend:
    build: ./frontend
    container_name: farmacia_frontend_container
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mysql_data: